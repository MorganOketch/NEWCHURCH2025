<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remnant Church Live Stream</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --text-color: #333;
            --light-bg: #f5f6fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
            position: relative;
        }

        .live-indicator {
            display: inline-block;
            background-color: var(--secondary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin-top: 0.5rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: 70% 30%;
            gap: 1rem;
        }

        .video-container {
            background: black;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            color: white;
        }

        .chat-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 5px;
            background: var(--light-bg);
        }

        .message-author {
            font-weight: bold;
            color: var(--primary-color);
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        .chat-input button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-input button:hover {
            background: var(--secondary-color);
        }

        .service-info {
            background: white;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .service-info h3 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .info-item i {
            color: var(--secondary-color);
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .chat-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Remnant Church Live Stream</h1>
        <div class="live-indicator">
            <i class="fas fa-broadcast-tower"></i> LIVE NOW
        </div>
    </header>

    <main class="main-container">
        <div class="left-column">
            <div class="video-container">
                <div class="video-placeholder">
                    <h2><i class="fas fa-video"></i> Live Stream Will Begin Shortly</h2>
                </div>
            </div>
            <div class="service-info">
                <h3>Today's Service</h3>
                <div class="info-item">
                    <i class="fas fa-user"></i>
                    <span>Pastor John Doe</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-bible"></i>
                    <span>Sunday Service - "Walking in Faith"</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span>10:00 AM - 12:00 PM</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-users"></i>
                    <span>1,234 Watching</span>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <h3>Live Chat</h3>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here by JavaScript -->
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>

    <script>
        // Sample messages for demonstration
        const sampleMessages = [
            { author: 'Sarah', message: 'Good morning everyone! Blessed to be here today.' },
            { author: 'Michael', message: 'Amen! The worship service is beautiful.' },
            { author: 'Rebecca', message: 'Praying for everyone joining us online today 🙏' }
        ];

        // Function to add a message to the chat
        function addMessage(author, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="message-author">${author}</div>
                <div class="message-content">${message}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Function to handle sending a message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage('You', message);
                input.value = '';
            }
        }

        // Add sample messages on load
        window.onload = function() {
            sampleMessages.forEach(msg => {
                addMessage(msg.author, msg.message);
            });
        };

        // Listen for Enter key in the input field
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Update viewer count randomly for demo purposes
        setInterval(() => {
            const viewerElement = document.querySelector('.info-item .fa-users + span');
            const currentViewers = parseInt(viewerElement.textContent);
            const change = Math.floor(Math.random() * 11) - 5; // Random change between -5 and +5
            const newViewers = Math.max(1000, currentViewers + change);
            viewerElement.textContent = newViewers.toLocaleString() + ' Watching';
        }, 5000);
    </script>
</body>
</html>
