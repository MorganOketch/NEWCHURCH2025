<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Church - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f6f9fc 0%, #edf2f7 100%);
            min-height: 100vh;
            color: #2d3748;
            line-height: 1.6;
        }

        /* Auth Container Styles */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 
                        0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 460px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Heading Styles */
        h2 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1a365d;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Social Auth Buttons */
        .social-auth {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-auth button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.875rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            background: white;
            font-size: 0.9375rem;
            font-weight: 500;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .google-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e0;
        }

        .facebook-btn {
            background-color: #1877f2;
            border-color: #1877f2;
            color: white;
        }

        .facebook-btn:hover {
            background-color: #1664d9;
        }

        /* Divider Styles */
        .divider {
            position: relative;
            text-align: center;
            margin: 1.5rem 0;
        }

        .divider::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            position: relative;
            background: white;
            padding: 0 1rem;
            color: #718096;
            font-size: 0.875rem;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #4a5568;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 2.5rem;
            color: #718096;
            cursor: pointer;
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .forgot-password {
            color: #4299e1;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #2b6cb0;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background: #2b6cb0;
            transform: translateY(-1px);
        }

        /* Auth Redirect */
        .auth-redirect {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #718096;
        }

        .auth-redirect a {
            color: #4299e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .auth-redirect a:hover {
            color: #2b6cb0;
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .auth-container {
                padding: 1rem;
            }

            .auth-card {
                padding: 1.5rem;
                border-radius: 0.75rem;
            }

            h2 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .social-auth button {
                padding: 0.75rem;
                font-size: 0.875rem;
            }

            .form-options {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
                color: #e2e8f0;
            }

            .auth-card {
                background: #2d3748;
                border: 1px solid #4a5568;
            }

            h2 {
                color: #e2e8f0;
            }

            .social-auth button {
                background: #2d3748;
                border-color: #4a5568;
                color: #e2e8f0;
            }

            .google-btn:hover {
                background: #4a5568;
            }

            input {
                background: #2d3748;
                border-color: #4a5568;
                color: #e2e8f0;
            }

            input:focus {
                border-color: #4299e1;
            }

            .divider span {
                background: #2d3748;
                color: #a0aec0;
            }

            label {
                color: #e2e8f0;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- Header content -->
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <div class="social-auth">
                <button class="google-btn">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>
                <button class="facebook-btn">
                    <i class="fab fa-facebook"></i>
                    Continue with Facebook
                </button>
            </div>
            <div class="divider">
                <span>or</span>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                    <span class="password-toggle"><i class="far fa-eye"></i></span>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
            <p class="auth-redirect">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>
        </div>
    </main>

    <script>
        // Password visibility toggle
        document.querySelector('.password-toggle').addEventListener('click', function() {
            const passwordInput = document.querySelector('#password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Form submission and localStorage handling
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();  // Prevent form from submitting normally

            // Collect form data
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Retreive from localStorage
            const data = JSON.parse(localStorage.getItem('user'));

            if (!data) {
                alert("No Users found!");
                return;
            }
            console.log(data);

            // Validate: Check if email and password match
                if (email !== data.email) {
                    alert("Invalid email address!");
                    return;
                }

                if (password !== data.password) {
                    alert("Incorrect password!");
                    return;
                }

                // If login is successful
                
            window.location.href = 'dashboard.html'; // Redirect to login page after successful registration
        });
    </script>
</body>
</html>
